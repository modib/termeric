name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: |
          sudo apt-get update && sudo apt-get install -y zsh fish
          bash -n termeric_bash
          bash -n bin/termeric
          zsh -n termeric_zsh
          fish -n termeric_fish
          ./bin/termeric version
          ./bin/termeric help
          ./bin/termeric doctor

      - name: Build release tarball
        run: |
          tar czf termeric-${{ steps.version.outputs.version }}.tar.gz \
            --transform='s,^,termeric-${{ steps.version.outputs.version }}/,' \
            termeric_bash termeric_zsh termeric_fish bin/ completions/ packaging/ LICENSE README.md VERSION

      - name: Build deb package
        run: |
          mkdir -p /tmp/termeric-pkg/DEBIAN
          mkdir -p /tmp/termeric-pkg/usr/bin
          mkdir -p /tmp/termeric-pkg/usr/share/termeric
          mkdir -p /tmp/termeric-pkg/usr/share/bash-completion/completions
          mkdir -p /tmp/termeric-pkg/usr/share/zsh/site-functions
          mkdir -p /tmp/termeric-pkg/usr/share/fish/vendor_completions.d
          cp bin/termeric /tmp/termeric-pkg/usr/bin/
          cp termeric_bash termeric_zsh termeric_fish /tmp/termeric-pkg/usr/share/termeric/
          cp completions/termeric.bash /tmp/termeric-pkg/usr/share/bash-completion/completions/termeric
          cp completions/termeric.zsh /tmp/termeric-pkg/usr/share/zsh/site-functions/_termeric
          cp completions/termeric.fish /tmp/termeric-pkg/usr/share/fish/vendor_completions.d/
          cat > /tmp/termeric-pkg/DEBIAN/control << EOF
          Package: termeric
          Version: ${{ steps.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: all
          Depends: bash, zsh, git
          Maintainer: modib <noreply@github.com>
          Homepage: https://modib.github.io/termeric/
          Description: Golden prompts for your terminal
           AI-powered, modernized shell prompt for bash, zsh, and fish.
          EOF
          dpkg-deb --build /tmp/termeric-pkg termeric_${{ steps.version.outputs.version }}_all.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: termeric v${{ steps.version.outputs.version }}
          body: |
            ## termeric ${{ steps.version.outputs.version }}

            Golden prompts for your terminal.

              ### Install

             **macOS (Homebrew):**
             ```bash
             brew tap modib/termeric
             brew install termeric
             ```

             **Linux (deb):**
             ```bash
             dpkg -i termeric_${{ steps.version.outputs.version }}_all.deb
             ```

             **Any platform:**
             ```bash
             curl -fsSL https://raw.githubusercontent.com/modib/termeric/main/install.sh | bash
             ```

             ### Quick Start
             ```bash
             termeric install
             exec bash  # or exec zsh
             ```

             ### Documentation
             https://modib.github.io/termeric/
          files: |
            termeric-${{ steps.version.outputs.version }}.tar.gz
            termeric_${{ steps.version.outputs.version }}_all.deb
          draft: false
          prerelease: false

      - name: Publish to homebrew-termeric tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Fetch the tarball SHA from GitHub
          SHA=$(curl -fsSL "https://github.com/modib/termeric/archive/refs/tags/v${VERSION}.tar.gz" | shasum -a 256 | cut -d' ' -f1)

          # Clone the tap repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/modib/homebrew-termeric.git" /tmp/homebrew-termeric

          cd /tmp/homebrew-termeric

          # Write formula (use unquoted heredoc for bash vars, escape Ruby interpolations)
          cat > Formula/termeric.rb << FORMULA
          class Termeric < Formula
            desc "Golden prompts for your terminal"
            homepage "https://modib.github.io/termeric/"
            url "https://github.com/modib/termeric/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SHA}"
            license "MIT"
            head "https://github.com/modib/termeric.git", branch: "main"

            depends_on "bash"
            depends_on "zsh"

            def install
              pkgshare.install "termeric_bash", "termeric_zsh", "termeric_fish"
              bin.install "bin/termeric"
              bash_completion.install "completions/termeric.bash" => "termeric"
              zsh_completion.install "completions/termeric.zsh" => "_termeric"
              fish_completion.install "completions/termeric.fish" => "termeric.fish"
            end

            def caveats
              <<~EOS
                To activate termeric, run:

                  termeric install

                Or manually add to your shell config:

                  bash (~/.bashrc):
                    if [ -f \#{pkgshare}/termeric_bash ]; then
                        . \#{pkgshare}/termeric_bash
                    fi

                  zsh (~/.zshrc):
                    if [ -f \#{pkgshare}/termeric_zsh ]; then
                        . \#{pkgshare}/termeric_zsh
                    fi

                  fish (~/.config/fish/config.fish):
                    source \#{pkgshare}/termeric_fish

                For powerline mode (recommended):

                  termeric font

                Configuration (set before sourcing):

                  PROMPT_COLOR=on        Master color switch: on (default) or off
                  PROMPT_STYLE=0         Prompt style: 0=powerline, 1=basename, 2=abbreviated, 3=full path, 4=long text (default: 0)
                  PROMPT_SHOW_USER=on    Show user@host segment (default: on)
                  PROMPT_SHOW_EXIT=on    Show exit code on failure (default: on)
                  PROMPT_SHOW_DIR=on     Show directory path (default: on)
                  PROMPT_SHOW_SSH=on     Show SSH indicator when connected (default: on)
                  PROMPT_SHOW_TIME=off   Show command duration when >=2s (default: off)
                  PROMPT_VENV=off        Show Python virtualenv/conda name (default: off)
                  PROMPT_NODE=off        Show Node.js version (default: off)
                  PROMPT_K8S=off         Show Kubernetes context (default: off)
              EOS
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/termeric version")
              assert_match "termeric", shell_output("\#{bin}/termeric help")
            end
          end
          FORMULA

          git add Formula/termeric.rb
          git commit -m "Update to v${VERSION}"
          git push

      - name: Reminder to update homebrew-termeric
        if: ${{ secrets.HOMEBREW_TAP_TOKEN == '' }}
        run: |
          echo "::warning::Set HOMEBREW_TAP_TOKEN secret to auto-publish to homebrew-termeric"
          echo "Manual steps:"
          echo "  SHA=\$(curl -fsSL https://github.com/modib/termeric/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz | shasum -a 256 | cut -d' ' -f1)"
          echo "  # Update homebrew-termeric/Formula/termeric.rb with url and sha256"
