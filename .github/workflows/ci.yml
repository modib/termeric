name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          bash -n termeric_bash
          bash -n bin/termeric

      - name: Check zsh syntax
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n termeric_zsh

      - name: Check fish syntax
        run: |
          sudo apt-get install -y fish
          fish -n termeric_fish

      - name: Install shfmt
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      - name: Check shell formatting
        run: shfmt -d bin/termeric

  test-bash:
    name: Test (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source termeric in bash
        run: |
          cp termeric_bash ~/.bashrc_custom
          echo '[ -f ~/.bashrc_custom ] && . ~/.bashrc_custom' >> ~/.bashrc
          bash -i -c 'echo "PS1=$PS1"'

      - name: Test prompt renders
        run: |
          bash -c '
            source termeric_bash
            __termeric_ps1
            echo "Exit code: $?"
          '

      - name: Test outside git repo
        run: |
          bash -c '
            cd /tmp
            source termeric_bash
            __termeric_ps1
            echo "Non-git prompt OK"
          '

      - name: Test git info caching
        run: |
          bash -c '
            source termeric_bash
            cd /tmp && mkdir -p test-repo && cd test-repo
            git init
            __tmerm_git_info
            echo "First call OK"
            __tmerm_git_info
            echo "Cache hit OK"
            rm -rf /tmp/test-repo
          '

  test-zsh:
    name: Test (zsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Source termeric in zsh
        run: |
          cp termeric_zsh ~/.zshrc_custom
          echo '[ -f ~/.zshrc_custom ] && . ~/.zshrc_custom' >> ~/.zshrc
          zsh -i -c 'echo "PROMPT=$PROMPT"'

      - name: Test prompt renders
        run: |
          zsh -c '
            source termeric_zsh
            __termeric_prompt
            echo "Exit code: $?"
          '

      - name: Test outside git repo
        run: |
          zsh -c '
            cd /tmp
            source termeric_zsh
            __termeric_prompt
            echo "Non-git prompt OK"
          '

  test-fish:
    name: Test (fish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Source termeric in fish
        run: |
          mkdir -p ~/.config/fish
          cp termeric_fish ~/.config/fish/termeric_fish

      - name: Test prompt renders
        run: |
          fish -c '
            source termeric_fish
            fish_prompt
            echo "Exit code: $status"
          '

      - name: Test outside git repo
        run: |
          fish -c '
            cd /tmp
            source termeric_fish
            fish_prompt
            echo "Non-git prompt OK"
          '

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test version command
        run: ./bin/termeric version

      - name: Test help command
        run: ./bin/termeric help

      - name: Test doctor command
        run: ./bin/termeric doctor

      - name: Test status command
        run: ./bin/termeric status

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test bash syntax
        run: |
          bash -n termeric_bash
          bash -n bin/termeric

      - name: Test zsh syntax
        run: zsh -n termeric_zsh

      - name: Test fish syntax
        run: |
          brew install fish
          fish -n termeric_fish

      - name: Test CLI
        run: |
          ./bin/termeric version
          ./bin/termeric help
          ./bin/termeric doctor

      - name: Test prompt in bash
        run: |
          bash -c '
            source termeric_bash
            __termeric_ps1
            echo "macOS bash OK"
          '

      - name: Test prompt in zsh
        run: |
          zsh -c '
            source termeric_zsh
            __termeric_prompt
            echo "macOS zsh OK"
          '

      - name: Test prompt in fish
        run: |
          fish -c '
            source termeric_fish
            fish_prompt
            echo "macOS fish OK"
          '

  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test-bash, test-zsh, test-fish, test-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build deb package
        run: |
          mkdir -p /tmp/termeric-pkg/DEBIAN
          mkdir -p /tmp/termeric-pkg/opt/termeric
          cp -r . /tmp/termeric-pkg/opt/termeric
          cat > /tmp/termeric-pkg/DEBIAN/control << EOF
          Package: termeric
          Version: ${{ steps.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: all
          Depends: bash, zsh, git
          Maintainer: modib <noreply@github.com>
          Homepage: https://modib.github.io/termeric/
          Description: Golden prompts for your terminal
           AI-powered, modernized shell prompt for bash, zsh, and fish.
          EOF
          dpkg-deb --build /tmp/termeric-pkg termeric_${{ steps.version.outputs.version }}_all.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: termeric-deb
          path: termeric_${{ steps.version.outputs.version }}_all.deb

      - name: Create release tarball
        run: |
          VERSION=$(cat VERSION)
          tar czf "termeric-$VERSION.tar.gz" \
            --transform="s,^,termeric-$VERSION/," \
            termeric_bash termeric_zsh termeric_fish bin/ completions/ Homebrew/ packaging/ LICENSE README.md VERSION

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: termeric-tarball
          path: termeric-*.tar.gz
